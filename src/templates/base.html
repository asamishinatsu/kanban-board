<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kanban Board{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">

</head>
<body>

    {% include 'partials/header.html' %}

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}
    {% include 'partials/confirm_delete_modal.html' %}

    <script src="{{ url_for('static', filename='scripts/dialogs.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/confirm_delete.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/auth_forms.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
